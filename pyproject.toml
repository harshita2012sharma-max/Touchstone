[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "touchstone-llm"
dynamic = ["version"]
description = "A touchstone for LLMs in Hindi and Hinglish: run small, reproducible evals from the command line."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Harshita Sharma" }]
keywords = ["llm", "evaluation", "benchmark", "hindi", "hinglish", "indic", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Hindi",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "sacrebleu>=2.4",  # only to verify our chrF implementation in tests
    "fastapi>=0.115",  # so server tests run in CI
    "uvicorn>=0.30",
]

[project.scripts]
touchstone = "touchstone_llm.cli:app"

[project.urls]
Homepage = "https://github.com/harshita2012sharma-max/Touchstone"
Issues = "https://github.com/harshita2012sharma-max/Touchstone/issues"
Changelog = "https://github.com/harshita2012sharma-max/Touchstone/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/touchstone_llm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/touchstone_llm"]
# The built web UI is gitignored (generated by `npm run build` in ui/) but must ship in the wheel.
artifacts = ["src/touchstone_llm/server/static/**"]

# Draft questions ship as a clearly separate "drafts" folder. They are used only when the
# user asks for them, and results made with them are marked unreviewed.
[tool.hatch.build.targets.wheel.force-include]
"datasets/pending" = "touchstone_llm/tasks/data/drafts"

[tool.hatch.build.targets.sdist]
exclude = ["/ui/node_modules", "/results", "/.github", "/datasets/review", "/runs", "/.touchstone"]
artifacts = ["src/touchstone_llm/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D100", "D104"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/touchstone_llm"]
