<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="touchstone: run small, reproducible LLM evals in Hindi and Hinglish." />
    <title>touchstone</title>
    <script>
      // Apply the saved or system theme before first paint (no flash).
      try {
        var t = localStorage.getItem("touchstone-theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
