name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (no network)
        run: pytest

  package:
    # Builds the web UI and the wheel, then checks the wheel works without the UI extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI (no install scripts, exact lockfile)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip install build twine && python -m build && twine check dist/*  # same as release: wheel is built from the sdist
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "kasauti/server/static/index.html" in names, "UI missing from wheel"
          assert not any(".env" in n for n in names), ".env must never ship"
          assert not any("pending" in n for n in names), "unreviewed data must not ship"
          print("wheel OK:", len(names), "files")
          PY
      - name: Smoke test in a clean venv (core install, no UI extra)
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/kasauti --version
          /tmp/v/bin/kasauti list-tasks
          /tmp/v/bin/kasauti ui --no-open 2>&1 | grep -q 'pip install "kasauti\[ui\]"'
