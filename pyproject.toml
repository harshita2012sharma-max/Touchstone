[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kasauti"
dynamic = ["version"]
description = "A touchstone for LLMs in Hindi and Hinglish: run small, reproducible evals from the command line."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "kasauti contributors" }]
keywords = ["llm", "evaluation", "benchmark", "hindi", "hinglish", "indic", "nlp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Hindi",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
    "sacrebleu>=2.4",  # only to verify our chrF implementation in tests
]

[project.scripts]
kasauti = "kasauti.cli:app"

[project.urls]
# TODO: replace OWNER once the GitHub repository exists.
Homepage = "https://github.com/OWNER/kasauti"
Issues = "https://github.com/OWNER/kasauti/issues"
Changelog = "https://github.com/OWNER/kasauti/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kasauti/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kasauti"]

[tool.hatch.build.targets.sdist]
exclude = ["/ui/node_modules", "/results", "/.github"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/kasauti"]
